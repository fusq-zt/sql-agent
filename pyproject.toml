[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-sql-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph==1.0.4", "httpx==0.28.1"]

[project.optional-dependencies]
training = ["agentlightning==0.3.1", "verl==0.6.1", "torch", "transformers==5.10.1", "omegaconf==2.3.0"]
test = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["sql_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
